<!doctype html><html lang="pt-PT"><meta charset="utf-8"><title>Exportar dados antigos DM</title><style>body{font:16px Arial;max-width:700px;margin:60px auto;padding:20px}button{padding:14px;background:#173a63;color:white;border:0;border-radius:8px}</style><h1>Exportar dados antigos</h1><p>Abra este conteúdo no endereço original, no mesmo navegador e perfil onde os movimentos estão guardados. Este exportador não apaga nem altera os dados.</p><p id="info"></p><button id="export">Exportar dados antigos (JSON)</button><script>
let items=[];try{items=JSON.parse(localStorage.getItem('dm_fin_v1')||'[]');if(!Array.isArray(items))throw Error('Formato inválido');info.textContent=items.length+' movimento(s) encontrado(s).';document.getElementById('export').disabled=!items.length}catch(e){info.textContent='Não foi possível ler os dados: '+e.message;document.getElementById('export').disabled=true}
document.getElementById('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({format:'dm-finance-v1',movements:items},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='dados_antigos_dm.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
